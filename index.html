:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eaf6f1;background:#0b1918}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(155deg,#183b35 0,#0b1918 340px);padding-bottom:90px}header{padding:calc(env(safe-area-inset-top) + 22px) 20px 15px;max-width:700px;margin:auto}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9dcfc0;font-weight:800}h1{font-size:32px;letter-spacing:-1.2px;margin:6px 0 4px}h2{font-size:20px;margin:0}p{color:#b5c9c3;line-height:1.5}.sub{font-size:13px;margin:0}.wrap{max-width:700px;margin:auto;padding:0 15px}.panel{background:#172b29;border:1px solid #2b4640;border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 10px 28px #0002}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.pill{border-radius:100px;padding:6px 10px;background:#28483e;color:#b6ead3;font-size:12px;font-weight:750}.muted{color:#9cb4ab;font-size:13px}.hero{background:linear-gradient(120deg,#2e775e,#1b4e48);border-color:#4b9c7b}.hero h2{font-size:27px;margin:9px 0}.btn{background:#c3f479;color:#17302a;border:0;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:800;cursor:pointer}.btn.secondary{background:#2d4640;color:#e4f4ee}.btn.danger{background:#503330;color:#ffd1c9}.btn.small{padding:8px 10px;font-size:12px}.btn:disabled{opacity:.45}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#122521;border-top:1px solid #2e4942;padding:9px 12px calc(9px + env(safe-area-inset-bottom));z-index:10}.tabs-inner{display:flex;width:100%;max-width:700px;gap:6px}.tab{flex:1;border:0;background:transparent;color:#a5bfb5;padding:10px 2px;border-radius:12px;font-weight:700;font-size:12px}.tab.active{background:#294b3d;color:#c8f586}.exercise{border-top:1px solid #304842;padding-top:16px;margin-top:16px}.exercise:first-of-type{border-top:0;margin-top:0;paddin
